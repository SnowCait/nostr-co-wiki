name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm ci
      - name: Check Node.js type definitions
        run: |
          node_version=$(node -p 'process.versions.node')
          types_version=$(node -p "require('@types/node/package.json').version")
          if [ "${node_version%%.*}" != "${types_version%%.*}" ]; then
            echo "Node.js version $node_version does not match @types/node version $types_version" >&2
            exit 1
          fi
      - run: npm run types:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm test
      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: error
